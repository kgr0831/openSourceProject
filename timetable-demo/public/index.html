<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="과목과 생활 패턴으로 만드는 나에게 맞는 대학 시간표">
  <title>캠퍼스 시간표</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/app-icon-180.png">
  <link rel="preload" href="/assets/pretendard-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/pretendard-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/lms.css">
  <link rel="stylesheet" href="/vendor/fullcalendar/skeleton.css">
  <link rel="stylesheet" href="/vendor/fullcalendar/theme.css">
  <link rel="stylesheet" href="/vendor/fullcalendar/palette.css">
  <link rel="stylesheet" href="/calendar.css">
</head>
<body>
  <a class="skip-link" href="#content">본문으로 이동</a>
  <div id="app"><main class="boot" role="status">시간표를 준비하고 있어요.</main></div>
  <div id="lms-panel-host" hidden>
<section id="lms-panel" class="lms-panel" aria-labelledby="lms-connection-title">
<div class="lms-connect-row"><div class="lms-identity"><h2 id="lms-connection-title">숭실대 LMS로 시작하기</h2><span id="lms-badge" class="badge neutral" hidden></span><p id="lms-connection-description" class="subtle"></p></div>
<div class="lms-actions"><button id="lms-connect" type="button" class="button primary large" disabled><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 5l9 4.5-9 4.5z"/><path d="M7 12v4c1.5 1.4 3.2 2 5 2s3.5-.6 5-2v-4"/></svg><span id="lms-connect-label">LMS로 로그인</span></button><button id="lms-disconnect" type="button" class="button secondary" hidden>로그아웃</button></div></div>
<div id="lms-login-help" class="lms-actions" hidden><button id="lms-focus" type="button" class="button secondary">학교 로그인 창 보기</button><button id="lms-confirm" type="button" class="button secondary">로그인 완료했어요</button></div>
<p id="lms-message" class="message" role="status" aria-live="polite" hidden></p>
<div id="lms-course-picker" hidden>
<h3>캘린더에 넣을 과목</h3>
<div class="lms-course-tools"><label><span class="sr-only">과목 검색</span><input id="lms-search" type="search" placeholder="과목 검색"></label><label><span class="sr-only">학기</span><select id="lms-term"><option value="">모든 학기</option></select></label></div>
<div class="lms-course-tools"><span id="lms-selection-count" class="subtle">0개 선택</span><button id="lms-select-visible" type="button" class="button quiet">모두 선택</button><button id="lms-clear" type="button" class="button quiet">해제</button></div>
<div id="lms-courses" class="lms-courses"></div><p id="lms-no-courses" class="subtle" hidden>검색한 과목이 없어요.</p>
<div class="lms-sync-row"><button id="lms-sync" type="button" class="button primary" disabled>일정 가져오기</button><button id="lms-cancel" type="button" class="button secondary" hidden>중단</button></div>
</div>
<div id="lms-progress" class="lms-progress" role="status" hidden><strong id="lms-progress-label">일정을 가져오고 있어요.</strong><progress id="lms-progress-bar" max="1" value="0" aria-label="일정 가져오기 진행률"></progress></div>
<div id="lms-result" class="lms-result" hidden><div><strong id="lms-result-title"></strong><p id="lms-result-detail" class="subtle"></p></div><button id="lms-show-calendar" type="button" class="button secondary">캘린더에서 보기</button></div>
<p id="lms-warnings" class="field-note" hidden></p>
<p class="privacy-note">비밀번호는 학교 로그인 창에만 입력해요. 로그인 상태는 이 PC에 암호화해 보관해요.</p>
</section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <dialog id="event-dialog" class="planner-dialog" aria-labelledby="event-dialog-title"></dialog>
  <noscript>시간표를 사용하려면 브라우저의 JavaScript를 켜 주세요.</noscript>
  <script src="/vendor/fullcalendar/calendar.js" defer></script>
  <script src="/vendor/fullcalendar/theme.js" defer></script>
  <script src="/vendor/fullcalendar/ko.js" defer></script>
  <script src="/app.js" type="module"></script>
</body>
</html>
